[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trainpilot"
version = "0.1.0"
description = "Short-run diagnosis of PyTorch training: whether the GPU is waiting for data or busy computing, with a ready-to-paste fix."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "linee64", email = "aidaraltynbek02@gmail.com"},
]
requires-python = ">=3.10"
keywords = [
    "pytorch",
    "gpu",
    "training",
    "mixed-precision",
    "amp",
    "torch.compile",
    "colab",
    "kaggle",
    "dataloader",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch",
]

[project.urls]
Homepage = "https://github.com/linee64/TrainPilot"
Repository = "https://github.com/linee64/TrainPilot"
Issues = "https://github.com/linee64/TrainPilot/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "matplotlib>=3.7",
]

[project.scripts]
trainpilot = "trainpilot.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["trainpilot*"]
exclude = ["tests*", "examples*", "notebooks*", "docs*"]
