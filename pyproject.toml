[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trainpilot"
version = "0.1.0"
readme = "README.md"
description = "Short-run diagnosis of PyTorch training: whether the GPU is computing or waiting for data."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch",
]

[project.scripts]
trainpilot = "trainpilot.cli:main"

[tool.setuptools.packages.find]
include = ["trainpilot*"]
